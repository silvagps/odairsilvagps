<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento | Odair Silva GPS</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="https://i.imgur.com/QMO8U0U.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2e4a1f;
            --accent: #c47a2b;
            --dark: #1e1e1a;
            --bg-light: #f5efe0;
            --white: #ffffff;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: #1c1c16;
            color: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: var(--bg-light);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            color: #2e2e2e;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .card h2 {
            font-family: 'Oswald', sans-serif;
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .card p {
            margin-bottom: 1rem;
            font-size: 1rem;
            color: #444;
        }
        .secure-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }
        .input-group input {
            padding: 0.7rem;
            font-size: 1.2rem;
            width: 180px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-family: 'Roboto', sans-serif;
        }
        .btn-accent {
            background: var(--accent);
            color: #1e1e1a;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-accent:hover { background: #a5621e; }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn-outline:hover { background: var(--accent); color: #1e1e1a; }
        #pix-qr {
            margin: 1rem auto;
            display: block;
        }
        .pix-key {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px;
            word-break: break-all;
            font-family: monospace;
            margin: 0.5rem 0;
            text-align: center;
        }
        .btn-copy {
            background: var(--accent);
            color: #1e1e1a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 0.5rem;
            transition: 0.3s;
        }
        .btn-copy:hover { background: #a5621e; }
        .note {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #666;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }
        /* WhatsApp float */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 8px 20px rgba(37,211,102,0.5);
            z-index: 999;
            transition: 0.3s;
            text-decoration: none;
        }
        .whatsapp-float:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="card">
        <div class="secure-icon">🔒</div>
        <h2>Pagamento Seguro</h2>
        <p>Informe o valor total do serviço (confira no recibo) ou clique abaixo para preencher automaticamente.</p>
        <div class="input-group">
            <span style="font-size: 1.5rem; font-weight: bold;">R$</span>
            <input type="number" id="valorInput" placeholder="0.00" step="0.01" min="0.01">
            <button class="btn-accent" onclick="gerarQRCode()">Gerar QR Code</button>
        </div>
        <button class="btn-outline" onclick="preencherValorPedido()">📥 Usar valor do pedido</button>
        <p class="note" style="color: red; display: none;" id="errorMsg">Informe um valor válido.</p>

        <div id="resultado" style="display: none;">
            <img id="pix-qr" src="" alt="QR Code PIX" width="200" height="200">
            <div class="pix-key" id="pixKey">91981743266</div>
            <button class="btn-copy" onclick="copyPix()">📋 Copiar chave PIX</button>
            <p class="note">Após o pagamento, envie o comprovante pelo WhatsApp.</p>
        </div>

        <a href="index.html" class="back-link">&larr; Voltar ao site</a>
    </div>

    <!-- WhatsApp flutuante -->
    <a href="https://wa.me/5591981743266?text=Olá%20Odair,%20acabei%20de%20realizar%20o%20pagamento%20do%20serviço." target="_blank" class="whatsapp-float" title="Enviar comprovante">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script>
        // Preenche o campo automaticamente com o valor armazenado no localStorage (se existir)
        function preencherValorPedido() {
            const valorSalvo = localStorage.getItem('valorPedido');
            if (valorSalvo) {
                document.getElementById('valorInput').value = valorSalvo;
                document.getElementById('errorMsg').style.display = 'none';
            } else {
                alert('Nenhum valor encontrado. Gere o pedido no simulador primeiro.');
            }
        }

        function gerarQRCode() {
            const input = document.getElementById('valorInput');
            const valor = parseFloat(input.value.replace(',', '.'));
            const errorMsg = document.getElementById('errorMsg');
            const resultado = document.getElementById('resultado');

            if (isNaN(valor) || valor <= 0) {
                errorMsg.style.display = 'block';
                resultado.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';
            resultado.style.display = 'block';

            const chave = '+5591981743266';
            const nome = 'JOSE ODAIR DA SILVA';
            const cidade = 'CAPANEMA';
            const valorStr = valor.toFixed(2);
            const tamanhoValor = valorStr.length.toString().padStart(2, '0');
            const base = '00020101021126360014br.gov.bcb.pix0114' + chave + '5204000053039865802BR5919' + nome + '6008' + cidade + '62070503***';
            const comValor = base + '54' + tamanhoValor + valorStr;
            const crc = crc16CCITT(comValor + '6304');
            const pixCode = comValor + '6304' + crc;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(pixCode)}`;
            document.getElementById('pix-qr').src = qrUrl;
        }

        function crc16CCITT(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        function copyPix() {
            const key = document.getElementById('pixKey').innerText;
            navigator.clipboard.writeText(key);
            alert('Chave PIX copiada!');
        }

        // Tenta preencher automaticamente ao carregar a página (se o valor já estiver no localStorage)
        window.addEventListener('load', function() {
            const valorSalvo = localStorage.getItem('valorPedido');
            if (valorSalvo) {
                document.getElementById('valorInput').value = valorSalvo;
            }
        });
    </script>
</body>
</html>
